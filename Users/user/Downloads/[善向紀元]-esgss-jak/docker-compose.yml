version: '3.8'

services:
  # ESG儀表板前端
  esg-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: esg-dashboard
    ports:
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://api.esg-dashboard.com
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_cache:/tmp/nginx_cache
    depends_on:
      - esg-api
    networks:
      - esg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ESG API後端 (模擬)
  esg-api:
    image: node:18-alpine
    container_name: esg-api
    working_dir: /app
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://esg_user:esg_password@esg-db:5432/esg_dashboard
      - REDIS_URL=redis://esg-redis:6379
      - JWT_SECRET=${JWT_SECRET:-default-jwt-secret}
    volumes:
      - ./api:/app
      - /app/node_modules
    command: sh -c "npm install && npm run build && npm start"
    depends_on:
      - esg-db
      - esg-redis
    networks:
      - esg-network
    restart: unless-stopped

  # PostgreSQL資料庫
  esg-db:
    image: postgres:15-alpine
    container_name: esg-db
    environment:
      - POSTGRES_DB=esg_dashboard
      - POSTGRES_USER=esg_user
      - POSTGRES_PASSWORD=esg_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - esg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esg_user -d esg_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis快取
  esg-redis:
    image: redis:7-alpine
    container_name: esg-redis
    command: redis-server --appendonly yes --requirepass esg_redis_password
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - esg-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx反向代理 (用於生產環境的多服務配置)
  esg-proxy:
    image: nginx:alpine
    container_name: esg-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - esg-dashboard
      - esg-api
    networks:
      - esg-network
    restart: unless-stopped
    profiles:
      - production

  # 監控服務
  esg-monitoring:
    image: prom/prometheus:latest
    container_name: esg-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - esg-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  nginx_logs:
    driver: local
  nginx_cache:
    driver: local

networks:
  esg-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16